<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TheHighWRLD Dashboard — Offline</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at 50% 0%, #1c1408 0%, #0a0a0a 60%);
    color: #f5e6c8;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    text-align: center;
    padding: 24px;
  }
  .card { max-width: 420px; }
  h1 { font-size: 20px; letter-spacing: .5px; margin: 0 0 8px; color: #f5c97b; }
  p { font-size: 14px; line-height: 1.6; color: #b9a789; margin: 0 0 22px; }
  button {
    appearance: none;
    border: 0;
    cursor: pointer;
    padding: 12px 26px;
    border-radius: 999px;
    font-size: 14px;
    font-weight: 700;
    color: #201000;
    background: linear-gradient(135deg, #f5c97b, #d4a574);
  }
  button:hover { filter: brightness(1.06); }
</style>
</head>
<body>
  <div class="card">
    <h1>You're offline</h1>
    <p>We couldn't reach TheHighWRLD Dashboard. Check your connection and try again.</p>
    <button onclick="location.replace('https://thehighwrlddashboard.pages.dev')">Retry</button>
  </div>
</body>
</html>
