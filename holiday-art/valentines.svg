      <stop offset="0" stop-color="#150308"/><stop offset=".6" stop-color="#3b0a1c"/><stop offset="1" stop-color="#1a040c"/>
    </linearGradient>
    <radialGradient id="warm" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fb7185" stop-opacity=".5"/><stop offset=".5" stop-color="#f43f5e" stop-opacity=".18"/><stop offset="1" stop-color="#f43f5e" stop-opacity="0"/>
    </radialGradient>
    <path id="heart" d="M0,-2 C0,-6 3,-8.2 5,-8.2 C9,-8.2 10,-4 10,-2 C10,3 5,7 0,11 C-5,7 -10,3 -10,-2 C-10,-4 -9,-8.2 -5,-8.2 C-3,-8.2 0,-6 0,-2 Z"/>
