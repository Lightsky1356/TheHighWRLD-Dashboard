<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300" role="img" aria-label="Fourth of July fireworks over the water">
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#040616"/><stop offset=".62" stop-color="#0a1030"/><stop offset="1" stop-color="#050a24"/>
    </linearGradient>
    <radialGradient id="redGlow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fca5a5" stop-opacity=".5"/><stop offset=".5" stop-color="#ef4444" stop-opacity=".2"/><stop offset="1" stop-color="#ef4444" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blueGlow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#93c5fd" stop-opacity=".55"/><stop offset=".5" stop-color="#3b82f6" stop-opacity=".22"/><stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <g id="fburst">
      <circle r="54" fill="url(#redGlow)"/>
      <g stroke="#fca5a5" stroke-width="2.4" stroke-linecap="round">
        <line y1="-18" y2="-44"/><line transform="rotate(45)" y1="-18" y2="-44"/><line transform="rotate(90)" y1="-18" y2="-44"/><line transform="rotate(135)" y1="-18" y2="-44"/>
        <line transform="rotate(180)" y1="-18" y2="-44"/><line transform="rotate(225)" y1="-18" y2="-44"/><line transform="rotate(270)" y1="-18" y2="-44"/><line transform="rotate(315)" y1="-18" y2="-44"/>
      </g>
      <circle fill="#ffffff" r="3.4"/><circle transform="rotate(90)" cy="-48" fill="#ffffff" r="2.4"/><circle transform="rotate(180)" cy="-48" fill="#ffffff" r="2.4"/>
    </g>
  </defs>
  <rect width="800" height="300" fill="url(#night)"/>
  <use href="#fburst" transform="translate(250 88)"/>
  <use href="#fburst" transform="translate(560 96) scale(1.35)" opacity=".9"/>
  <g stroke="#60a5fa" stroke-width="2" stroke-linecap="round" opacity=".8">
    <line x1="420" y1="140" x2="438" y2="130"/><line x1="452" y1="124" x2="466" y2="118"/>
  </g>
  <circle cx="452" cy="130" r="44" fill="url(#blueGlow)"/>
  <g fill="#dbeafe" opacity=".75">
    <circle cx="90" cy="42" r="1.4"/><circle cx="706" cy="34" r="1.6"/><circle cx="360" cy="30" r="1.2"/><circle cx="640" cy="60" r="1.3"/>
  </g>
  <rect y="228" width="800" height="72" fill="#050a1e"/>
  <path d="M0 228 L800 228 L800 236 Q600 242 400 236 Q200 230 0 238 Z" fill="#1d3a6e" opacity=".5"/>
  <g stroke-width="2" stroke-linecap="round" opacity=".75">
    <line x1="180" y1="252" x2="252" y2="252" stroke="#ef4444"/>
    <line x1="200" y1="264" x2="236" y2="264" stroke="#60a5fa"/>
    <line x1="520" y1="250" x2="596" y2="250" stroke="#fca5a5"/>
    <line x1="538" y1="262" x2="574" y2="262" stroke="#93c5fd"/>
    <line x1="546" y1="272" x2="566" y2="272" stroke="#e2e8f0"/>
    <line x1="360" y1="260" x2="420" y2="260" stroke="#93c5fd"/>
  </g>
</svg>
