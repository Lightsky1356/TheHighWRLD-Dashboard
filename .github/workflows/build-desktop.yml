name: Build Desktop
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
            installer: "*.AppImage"
          - os: macos-latest
            target: mac
            installer: "*.dmg"
          - os: windows-latest
            target: win
            installer: "*.exe"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: electron-app/package-lock.json
      - name: Install dependencies
        working-directory: electron-app
        run: npm ci
      - name: Build installer
        working-directory: electron-app
        run: npx electron-builder --${{ matrix.target }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}-build
          # Only the installer. Uploading the whole release folder made every
          # platform ship files with the same names (vk_swiftshader_icd.json,
          # *.pak, ...), and the release action died on the duplicate with a
          # 422 already_exists - leaving the other platforms' installers off
          # the release even though all three builds had succeeded.
          path: electron-app/release/${{ matrix.installer }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v1
        with:
          files: artifacts/**/*
          generate_release_notes: true
          overwrite: true
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
