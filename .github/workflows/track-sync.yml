# Auto-sync: watches the audio repo for new songs and mirrors them into
# tracks.js + the cover gradient table. Runs blind, so the script is dry-run
# by default and this workflow only enables writes through its inputs.
name: Track Sync

on:
  schedule:
    # every 30 minutes
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (logs what it would add, writes nothing)"
        type: boolean
        default: false

# the script pushes commits itself, so it needs write access
permissions:
  contents: write

# never let two runs race on the same files; the latest run supersedes
concurrency:
  group: track-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The owner's Auto Sync switch, read from the site's own API. A
      # scheduled run walks up to the public endpoint and stops here if the
      # owner turned the switch off - no commit, no jimp, nothing. A manual
      # dispatch is deliberately EXEMPT: the owner pressing "Run workflow"
      # is a decision in its own right. If the endpoint cannot be reached the
      # default stays ON, so an outage of the check never silently stops the
      # songs from syncing.
      - name: Owner Auto Sync switch
        if: github.event_name == 'schedule'
        id: autosync
        run: |
          enabled=true
          body=$(curl -sf --max-time 20 https://thehighwrlddashboard.pages.dev/api/autosync || true)
          if [ -n "$body" ]; then
            enabled=$(echo "$body" | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>{try{console.log(JSON.parse(d).enabled===false?"false":"true")}catch(_){console.log("true")}})')
          fi
          echo "enabled=$enabled" >> "$GITHUB_OUTPUT"
          if [ "$enabled" = "false" ]; then echo "Auto Sync is OFF - the owner turned the pipeline switch off. Doing nothing."; fi

      - name: Set up Node
        if: steps.autosync.outputs.enabled != 'false'
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # jimp is only used to decode the JPEG-in-png-name covers; install it
      # without touching package.json
      - name: Install jimp
        if: steps.autosync.outputs.enabled != 'false'
        run: npm install --no-save jimp --no-audit --no-fund

      - name: Run track sync
        if: steps.autosync.outputs.enabled != 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # dry dispatch: neither flag is set, so the script logs its finds
          # and writes nothing; everything else runs write+commit+push
          AUTO_SYNC_WRITE: ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '' || '1' }}
          AUTO_SYNC_COMMIT: ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '' || '1' }}
        run: node scripts/auto-sync-tracks.cjs
